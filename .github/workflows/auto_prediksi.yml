name: Auto Update Prediksi Bola

on:
  schedule:
    # Jam WIB = UTC+7, jadi kurangi 7 jam
    - cron: '45 23 * * *'   # 06:45 WIB
    - cron: '0 0 * * *'     # 07:00 WIB
    - cron: '30 0 * * *'    # 07:30 WIB
    - cron: '0 1 * * *'     # 08:00 WIB
    - cron: '30 1 * * *'    # 08:30 WIB
    - cron: '0 2 * * *'     # 09:00 WIB
    - cron: '30 2 * * *'    # 09:30 WIB
    - cron: '0 3 * * *'     # 10:00 WIB
    - cron: '0 5 * * *'     # 12:00 WIB
    - cron: '0 7 * * *'     # 14:00 WIB
    - cron: '0 9 * * *'     # 16:00 WIB
    - cron: '0 11 * * *'    # 18:00 WIB
  workflow_dispatch:         # Bisa dijalankan manual

jobs:
  update-prediksi:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run prediksi scraper
        env:
          GITHUB_ACTIONS: true
        run: python prediksi_bola.py
      
      - name: Commit dan push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html prediksi_lapak99.html || true
          git diff --cached --quiet || git commit -m "Auto update prediksi bola $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
